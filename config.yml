# =============================================================================
# config.yaml — Dataset-specific parameters for ST LR pipeline
# Change this file to run the same pipeline on any spatial transcriptomics dataset.
# =============================================================================

# ── Dataset identity ───────────────────────────────────────────────────────────
dataset_name: "kordowski_2025_dipg"
disease:      "DIPG"
species:      "human"   # used by `stLearn LR database loader

# ── Paths ──────────────────────────────────────────────────────────────────────
data_dir: "/w/20252/cchin/aafd/ai-drug-discovery/data"
# Base out_dir (used when not running with PIPELINE_RUN_ID). When running with PIPELINE_RUN_ID, merged config sets out_dir to outputs/<run_id>/.
out_dir:  "/w/20252/cchin/aafd/ai-drug-discovery/outputs"

# ── Run (logging) ──────────────────────────────────────────────────────────────
# Base config is static. run_id and run-specific overrides live in runs/<run_id>/config_overrides.yml.
# Run-specific script overwrites go in runs/<run_id>/steps/ (document in config_overrides.yml script_overrides).
# When running steps for a run, set PIPELINE_RUN_ID=<run_id> so steps use merged config and optional steps/.
run_id: null
samples:
- "GSM8608424_VLP73_A1"
- "GSM8608423_VLP74_A1"
- "GSM8608422_VLP74_D1"
- "GSM8608421_C1_VLP45"
- "GSM8608420_B1_VLP49"
- "GSM8608419_VLP70_20221108_A2"
- "GSM8608418_VLP70_20221108_D1"
- "GSM8608417__4_VLP65_20221019_D"
- "GSM8608416__3_VLP70_20221108_D2"
- "GSM8608415_VLP73_D1"

# ── Step 1: QC ────────────────────────────────────────────────────────────────
qc:
  ncount_min:   1000      # minimum total UMI counts per spot
  ncount_max:   75000     # maximum total UMI counts per spot
  mt_cutoff:    null      # set to e.g. 20 to hard-filter on % mitochondrial; null = no filter

# ── Step 2: Integration ───────────────────────────────────────────────────────
integration:
  n_features:   3000      # variable features for SCTransform + anchor selection
  n_pcs:        50        # PCs computed
  n_dims:       30        # PCs used for neighbour graph, UMAP

# ── Step 3: Clustering ────────────────────────────────────────────────────────
clustering:                                                     
  resolutions: [0.1, 0.3]
  chosen_resolution: 0.3

# ── Step 4: Annotation ────────────────────────────────────────────────────────
annotation:
  n_marker_genes:    50     # top N marker genes passed to EnrichR per cluster
  min_pct:           0.1    # FindAllMarkers: min fraction of cells expressing gene
  logfc_threshold:   0.25   # FindAllMarkers: minimum log2 fold-change
  enrichr_dbs:
    - "CellMarker_2024"
    - "PanglaoDB_Augmented_2021"
    - "Human_Gene_Atlas"
  # Hint for the adjudicating agent (step 4 does not auto-pick a label from this DB).
  primary_db: "CellMarker_2024"

  # Disease marker prior: when top-level `disease` is set, the pipeline agent must write
  # OUT_DIR/step4_disease_marker_prior.json before step 4 (see ST-LR skill). Optional path override:
  # disease_marker_prior_json: "custom_prior.json"
  # Minimum genes per cluster to query EnrichR (fallback uses unfiltered markers when prior omits a cluster).
  enrichr_min_genes: 5

  # Mechanical collation into step4_collated_candidates.json (top rows per DB + key markers).
  collate_enrichr_top_n: 5
  collate_marker_top_n: 15

  # EnrichR term filter applied when writing step4_enrichr_*.csv (not used to pick a final label in R).
  label_disqualify_patterns: []

# ── Step 7: Preprocessing (Python) ───────────────────────────────────────────
preprocessing:
  min_genes:           3       # minimum genes per spot (scanpy filter_cells)
  min_cells:           100     # minimum cells expressing a gene (scanpy filter_genes)
  normalize_target:    10000   # library size normalization target sum

# ── Step 8: LR scoring ────────────────────────────────────────────────────────
lr_scoring:
  databases:    ["connectomeDB2020_lit"]   # LR databases to load via stLearn
  n_pairs:      1000              # permutation pairs for significance testing
  min_spots:    3                 # minimum spots a LR pair must be expressed in
  n_neighbors:  6                 # spatial neighbourhood size

# ── Step 9: CCI ───────────────────────────────────────────────────────────────
cci:
  min_spots:            3     # minimum spots for CCI testing
  significance_cutoff:  0.05  # p-value threshold for retaining interactions